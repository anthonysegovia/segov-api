spring.application.name=segov-api
spring.datasource.url=jdbc:postgresql://localhost:5432/segov_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
segov.storage.video-path=uploads/videos
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB
segov.transcription.whisper.executable=C:/whisper-bin-x64/Release/whisper-cli.exe
segov.transcription.whisper.model=C:/whisper-bin-x64/models/ggml-base.bin
segov.transcription.whisper.language=es
